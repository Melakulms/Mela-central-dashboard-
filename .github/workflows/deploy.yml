name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://duizgtmbptmlbyipreqg.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_flQNx6AE3_dbPDHfYGNwWQ_7cMSsAng
          VITE_ADMIN_API_URL: https://duizgtmbptmlbyipreqg.supabase.co/functions/v1/mela-admin-api

      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      APP_URL: https://melakulms.github.io/Mela-central-dashboard-/
      SUPABASE_URL: https://duizgtmbptmlbyipreqg.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_flQNx6AE3_dbPDHfYGNwWQ_7cMSsAng
      ADMIN_API_URL: https://duizgtmbptmlbyipreqg.supabase.co/functions/v1/mela-admin-api
    steps:
      - uses: actions/checkout@v4
      - name: Verify published admin app
        run: bash scripts/production-smoke.sh app
      - name: Verify Supabase Auth health
        run: bash scripts/production-smoke.sh auth
      - name: Verify Supabase Data API
        run: bash scripts/production-smoke.sh data
      - name: Verify admin Edge Function gateway
        run: bash scripts/production-smoke.sh admin-api
