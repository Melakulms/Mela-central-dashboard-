# Dedicated static preview ONLY. This file lives on the staging PR branch.
# Never select main, merge this PR, or enable payment collection.
# Supabase publishable keys are public browser configuration, not privileged secrets.
services:
  - type: web
    runtime: static
    name: mela-scholarship-admin-staging
    repo: https://github.com/Melakulms/Mela-central-dashboard-
    branch: staging/scholarship-access-20261021
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: "off"
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
      - path: /index.html
        name: Cache-Control
        value: no-store
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_SUPABASE_URL
        value: https://tungqfmypuwzeyrtaseh.supabase.co
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_GHvo0PVvPVP9oo8qaslUmA_reIC-6TT
      - key: NODE_VERSION
        value: "22"
